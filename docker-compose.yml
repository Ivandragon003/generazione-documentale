services:
  # ───────────────────────────────────────────────────────────────
  # PostgreSQL
  # ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mac_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mac_documents}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${DB_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mac_documents}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mac_net


  # ───────────────────────────────────────────────────────────────
  # App NestJS
  # ───────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mac_app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: development

      PORT: ${PORT:-3000}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-mac_documents}

      STORAGE_PATH: /app/storage/pdf
      UPLOAD_PATH: /app/storage/uploads

    volumes:
      - pdf_storage:/app/storage/pdf
      - upload_storage:/app/storage/uploads

    ports:
      - "${PORT:-3000}:3000"

    networks:
      - mac_net


# ───────────────────────────────────────────────────────────────
# Volumes
# ───────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  pdf_storage:
  upload_storage:


# ───────────────────────────────────────────────────────────────
# Network
# ───────────────────────────────────────────────────────────────
networks:
  mac_net:
    driver: bridge