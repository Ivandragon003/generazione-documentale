# =============================================================================
# docker-compose.yml — stack completo per sviluppo / produzione
#
# Servizi:
#   app      — NestJS + XeLaTeX + Pandoc
#   postgres — PostgreSQL 16
#
# Utilizzo:
#   Sviluppo:   docker compose up
#   Produzione: docker compose -f docker-compose.yml up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mac_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB:       ${DB_NAME:-mac_documents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema applicato all'avvio solo se il volume è nuovo
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mac_documents}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mac_net

  # ---------------------------------------------------------------------------
  # App NestJS — XeLaTeX PDF generation
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PANDOC_VERSION: "3.6.4"
        TARGETARCH: "amd64"
    container_name: mac_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:    production
      PORT:        ${PORT:-3000}

      # Database
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME:     ${DB_NAME:-mac_documents}

      # Storage
      STORAGE_PATH:  /app/storage/pdf
      UPLOAD_PATH:   /app/storage/uploads

      # GitHub template source
      GITHUB_TEMPLATES_OWNER: ${GITHUB_TEMPLATES_OWNER:-}
      GITHUB_TEMPLATES_REPO:  ${GITHUB_TEMPLATES_REPO:-}
      GITHUB_TEMPLATES_BRANCH: ${GITHUB_TEMPLATES_BRANCH:-main}
      GITHUB_TEMPLATES_DIR:   ${GITHUB_TEMPLATES_DIR:-templates-catalog}
      GITHUB_TEMPLATES_CATALOG_PATH: ${GITHUB_TEMPLATES_CATALOG_PATH:-templates-catalog/CATALOG.json}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # PDF / XeLaTeX
      PANDOC_PATH:                  /usr/local/bin/pandoc
      PDF_GENERATION_TIMEOUT_MS:    ${PDF_GENERATION_TIMEOUT_MS:-120000}
      PDF_GENERATION_RETRIES:       ${PDF_GENERATION_RETRIES:-2}
      PDF_GENERATION_RETRY_DELAY_MS: ${PDF_GENERATION_RETRY_DELAY_MS:-1000}
      MAX_PDF_MARKDOWN_BYTES:       ${MAX_PDF_MARKDOWN_BYTES:-300000}
      PDF_PAPER:      ${PDF_PAPER:-a4}
      PDF_FONT_SIZE:  ${PDF_FONT_SIZE:-11pt}
      PDF_MARGIN_TOP: ${PDF_MARGIN_TOP:-2.5cm}
      PDF_MARGIN_BOTTOM: ${PDF_MARGIN_BOTTOM:-2.5cm}
      PDF_MARGIN_LEFT:   ${PDF_MARGIN_LEFT:-2.5cm}
      PDF_MARGIN_RIGHT:  ${PDF_MARGIN_RIGHT:-2.5cm}
      PDF_MAIN_FONT: ${PDF_MAIN_FONT:-Liberation Serif}
      PDF_SANS_FONT: ${PDF_SANS_FONT:-Liberation Sans}
      PDF_MONO_FONT: ${PDF_MONO_FONT:-Liberation Mono}

    volumes:
      - pdf_storage:/app/storage/pdf
      - upload_storage:/app/storage/uploads
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e",
        "const h=require('http');h.get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - mac_net

volumes:
  postgres_data:
  pdf_storage:
  upload_storage:

networks:
  mac_net:
    driver: bridge
