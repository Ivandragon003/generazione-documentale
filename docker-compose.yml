services:
  # ───────────────────────────────────────────────────────────────
  # PostgreSQL
  # ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mac_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${DB_HOST_PORT:-5433}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mac_net


  # ───────────────────────────────────────────────────────────────
  # App NestJS
  # ───────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mac_app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      pdf-service:
        condition: service_healthy

    environment:
      NODE_ENV: ${NODE_ENV:-development}

      PORT: ${PORT:-3000}

      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-mac_documents}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}

      STORAGE_PATH: ${STORAGE_PATH:-/app/storage/pdf}
      PDF_SERVICE_URL: ${PDF_SERVICE_URL:-http://pdf-service:3100}
      ENABLE_LOCAL_PDF_FALLBACK: ${ENABLE_LOCAL_PDF_FALLBACK:-false}
      MAX_TEMPLATE_CONTENT_BYTES: ${MAX_TEMPLATE_CONTENT_BYTES:-200000}
      MAX_PDF_MARKDOWN_BYTES: ${MAX_PDF_MARKDOWN_BYTES:-300000}
      PDF_QUEUE_RECOVERY_RETRY_MS: ${PDF_QUEUE_RECOVERY_RETRY_MS:-10000}
      PDF_JOBS_RETENTION_DAYS: ${PDF_JOBS_RETENTION_DAYS:-30}
      PDF_FAILED_JOBS_RETENTION_DAYS: ${PDF_FAILED_JOBS_RETENTION_DAYS:-7}
      PDF_RETENTION_RUN_EVERY_MS: ${PDF_RETENTION_RUN_EVERY_MS:-3600000}

      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_OWNER: ${GITHUB_OWNER}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TEMPLATES_DIR: ${GITHUB_TEMPLATES_DIR:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_DRAFT_NUM_PREDICT: ${OLLAMA_DRAFT_NUM_PREDICT:-1200}
      OLLAMA_AUDIT_NUM_PREDICT: ${OLLAMA_AUDIT_NUM_PREDICT:-350}
      OLLAMA_COMPACT_PROMPT_CHARS: ${OLLAMA_COMPACT_PROMPT_CHARS:-14000}
      OLLAMA_MAX_PROMPT_CHARS: ${OLLAMA_MAX_PROMPT_CHARS:-20000}
      OLLAMA_DRAFT_TEMPERATURE: ${OLLAMA_DRAFT_TEMPERATURE:-0.2}
      OLLAMA_AUDIT_TEMPERATURE: ${OLLAMA_AUDIT_TEMPERATURE:-0.1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      AI_AUDIT_DEBUG: ${AI_AUDIT_DEBUG:-false}
      AI_AUDIT_MIN_CONFIDENCE: ${AI_AUDIT_MIN_CONFIDENCE:-0.60}
      AI_AUDIT_CACHE_TTL_MS: ${AI_AUDIT_CACHE_TTL_MS:-300000}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
      PDF_GENERATION_RETRIES: ${PDF_GENERATION_RETRIES:-2}
      PDF_GENERATION_RETRY_DELAY_MS: ${PDF_GENERATION_RETRY_DELAY_MS:-1000}

    volumes:
      - pdf_storage:/app/storage/pdf
      # Sync openapi.json from container to host at each startup
      - ./openapi.json:/app/openapi.json

    ports:
      - "${PORT:-3000}:3000"

    networks:
      - mac_net
    extra_hosts:
      - "host.docker.internal:host-gateway"


  # PDF/LaTeX/Pandoc separato dall'app NestJS
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile.pdf

    container_name: mac_pdf_service
    restart: unless-stopped

    environment:
      PDF_SERVICE_PORT: 3100
      PDF_GENERATION_TIMEOUT_MS: ${PDF_GENERATION_TIMEOUT_MS:-120000}
      PANDOC_PATH: ${PANDOC_PATH:-/usr/bin/pandoc}
      PDF_SERVICE_DEBUG: ${PDF_SERVICE_DEBUG:-false}
      PDF_SERVICE_SAVE_TEX_ON_ERROR: ${PDF_SERVICE_SAVE_TEX_ON_ERROR:-false}

    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3100/health',r=>{let b='';r.on('data',c=>b+=c);r.on('end',()=>process.exit(r.statusCode===200&&b.includes('\\\"ok\\\":true')?0:1));}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mac_net


  # ───────────────────────────────────────────────────────────────
  # Frontend React (Vite → Nginx)
  # ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Il browser chiama il backend dall'esterno → usa localhost o il dominio reale
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}

    container_name: mac_frontend
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "4173:4173"

    networks:
      - mac_net


# ───────────────────────────────────────────────────────────────
# Volumes
# ───────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: mac_postgres_data
  pdf_storage:
    name: mac_pdf_storage


# ───────────────────────────────────────────────────────────────
# Network
# ───────────────────────────────────────────────────────────────
networks:
  mac_net:
    driver: bridge
