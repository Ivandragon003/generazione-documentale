services:
  # ───────────────────────────────────────────────────────────────
  # PostgreSQL
  # ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mac_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${DB_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mac_net


  # ───────────────────────────────────────────────────────────────
  # App NestJS
  # ───────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mac_app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      pdf-service:
        condition: service_healthy

    environment:
      NODE_ENV: development

      PORT: ${PORT:-3000}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      STORAGE_PATH: /app/storage/pdf
      PDF_SERVICE_URL: http://pdf-service:3100
      ENABLE_LOCAL_PDF_FALLBACK: "false"

    volumes:
      - pdf_storage:/app/storage/pdf
      # Sincronizza openapi.json dal container all'host ad ogni avvio
      - ./openapi.json:/app/openapi.json

    ports:
      - "${PORT:-3000}:3000"

    networks:
      - mac_net


  # PDF/LaTeX/Pandoc separato dall'app NestJS
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile.pdf

    container_name: mac_pdf_service
    restart: unless-stopped

    environment:
      PDF_SERVICE_PORT: 3100
      PDF_GENERATION_TIMEOUT_MS: ${PDF_GENERATION_TIMEOUT_MS:-120000}
      PANDOC_PATH: ${PANDOC_PATH:-/usr/bin/pandoc}

    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3100/health',r=>{let b='';r.on('data',c=>b+=c);r.on('end',()=>process.exit(r.statusCode===200&&b.includes('\\\"ok\\\":true')?0:1));}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mac_net


  # ───────────────────────────────────────────────────────────────
  # Frontend React (Vite → Nginx)
  # ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Il browser chiama il backend dall'esterno → usa localhost o il dominio reale
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}

    container_name: mac_frontend
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "4173:4173"

    networks:
      - mac_net


# ───────────────────────────────────────────────────────────────
# Volumes
# ───────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  pdf_storage:


# ───────────────────────────────────────────────────────────────
# Network
# ───────────────────────────────────────────────────────────────
networks:
  mac_net:
    driver: bridge
